<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Walk Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font: 16px system-ui, sans-serif;
    }

    #status, #controls {
      position: fixed;
      z-index: 10;
    }

    #status {
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      margin: 0;
      padding: 10px;
      border-radius: 10px;
      background: #17202a;
      color: white;
      text-align: center;
      pointer-events: none;
    }

    #controls {
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 6px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #controls[hidden] { display: none; }

    button {
      min-height: 50px;
      border: 1px solid #9ca9b8;
      border-radius: 10px;
      background: #17202a;
      color: white;
      font: inherit;
    }

    button:active { background: #305b83; }
    button:disabled { opacity: 0.45; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading…</p>

  <div id="controls" role="group" aria-label="Character controls" hidden>
    <button data-x="0" data-z="-1" aria-label="Move forward"
            style="grid-column: 2" disabled>↑</button>
    <button data-x="-1" data-z="0" aria-label="Move left"
            style="grid-column: 1; grid-row: 2" disabled>←</button>
    <button id="reset" style="grid-column: 2; grid-row: 2" disabled>Reset</button>
    <button data-x="1" data-z="0" aria-label="Move right"
            style="grid-column: 3; grid-row: 2" disabled>→</button>
    <button data-x="0" data-z="1" aria-label="Move back"
            style="grid-column: 2; grid-row: 3" disabled>↓</button>
  </div>

  <template id="phone-scene">
    <a-scene mindar-image="imageTargetSrc: ./targets.mind"
             xr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="phone-platform" src="./platform.glb"></a-asset-item>
        <a-asset-item id="phone-character" src="./character.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0"
                look-controls="enabled: false"
                wasd-controls="enabled: false"></a-camera>

      <a-entity id="marker" mindar-image-target="targetIndex: 0">
        <a-entity rotation="90 0 0" scale="0.25 0.25 0.25">
          <a-entity id="platform" gltf-model="#phone-platform"
                    position="0 -0.05 0"></a-entity>

          <a-box position="0 0.6 -1.9" width="0.65" height="1.2"
                 depth="0.18" color="#e87935"></a-box>

          <a-entity id="player" rotation="0 180 0">
            <a-entity id="character" gltf-model="#phone-character"></a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </template>

  <template id="tv-scene">
    <a-scene background="color: #7fb1d0" xr-mode-ui="enabled: false">
      <a-assets>
        <a-asset-item id="tv-platform" src="./platform.glb"></a-asset-item>
      </a-assets>

      <a-entity id="platform" gltf-model="#tv-platform"
                position="0 -0.05 0"></a-entity>

      <a-box position="0 0.6 -1.9" width="0.65" height="1.2"
             depth="0.18" color="#e87935"></a-box>

      <a-entity id="camera-rig">
        <a-camera position="0 1.6 0"
                  look-controls="enabled: false"
                  wasd-controls="enabled: false"></a-camera>
      </a-entity>
    </a-scene>
  </template>

  <script>
    const relayUrl = 'wss://ardemorelay.onrender.com';
    const tvMode = new URLSearchParams(location.search).has('tv');
    const status = document.querySelector('#status');
    const template = document.querySelector(tvMode ? '#tv-scene' : '#phone-scene');

    // Attach listeners before inserting the scene so early events are caught.
    const scene = template.content.cloneNode(true);
    const platform = scene.querySelector('#platform');
    const socketUrl = new URL(relayUrl);
    socketUrl.searchParams.set('role', tvMode ? 'tv' : 'phone');

    let socket;

    function connectRelay(onMessage, onChange) {
      socket = new WebSocket(socketUrl);
      socket.addEventListener('open', onChange);
      socket.addEventListener('message', onMessage);
      socket.addEventListener('close', () => {
        onChange();
        setTimeout(() => connectRelay(onMessage, onChange), 2000);
      });
    }

    if (tvMode) {
      const cameraRig = scene.querySelector('#camera-rig');
      let platformFailed = false;

      function showConnection() {
        status.hidden = false;
        if (platformFailed) {
          status.textContent = 'Could not load platform.glb.';
        } else {
          status.textContent = socket?.readyState === WebSocket.OPEN
            ? 'Waiting for the phone…'
            : 'Connecting to the TV relay…';
        }
      }

      platform.addEventListener('model-error', () => {
        platformFailed = true;
        showConnection();
      });

      connectRelay(event => {
        const { x, z, yaw } = JSON.parse(event.data);
        cameraRig.object3D.position.set(x, 0, z);
        cameraRig.object3D.rotation.y = yaw + Math.PI;
        if (!platformFailed) status.hidden = true;
      }, showConnection);

      showConnection();
    } else {
      const marker = scene.querySelector('#marker');
      const player = scene.querySelector('#player');
      const character = scene.querySelector('#character');
      const controls = document.querySelector('#controls');
      const buttons = controls.querySelectorAll('button');

      let tracking = false;
      let platformReady = false;
      let characterReady = false;
      let error = '';
      let movement = null;
      let mixer;
      let walk;
      let lastPose = '';

      controls.hidden = false;

      function updateControls() {
        const ready = tracking && platformReady && characterReady && !error;
        for (const button of buttons) button.disabled = !ready;

        const gameMessage = error || (tracking
          ? (ready ? 'Hold an arrow to move.' : 'Loading the models…')
          : 'Point your camera at the marker.');

        const connectionMessage = socket?.readyState === WebSocket.OPEN
          ? '' : ' Connecting to the TV relay…';

        status.textContent = gameMessage + connectionMessage;
      }

      function stopMoving() {
        movement = null;
        if (walk) walk.paused = true;
      }

      marker.addEventListener('targetFound', () => {
        tracking = true;
        updateControls();
      });

      marker.addEventListener('targetLost', () => {
        tracking = false;
        stopMoving();
        updateControls();
      });

      platform.addEventListener('model-loaded', () => {
        platformReady = true;
        updateControls();
      });

      character.addEventListener('model-loaded', event => {
        const model = event.detail.model;
        const clip = model.animations?.[0];

        if (clip) {
          mixer = new AFRAME.THREE.AnimationMixer(model);
          walk = mixer.clipAction(clip).play();
          mixer.update(0);
          walk.paused = true;
        }

        characterReady = true;
        updateControls();
      });

      for (const [entity, file] of [
        [platform, 'platform.glb'],
        [character, 'character.glb']
      ]) {
        entity.addEventListener('model-error', () => {
          error = `Could not load ${file}.`;
          stopMoving();
          updateControls();
        });
      }

      for (const button of controls.querySelectorAll('[data-x]')) {
        button.addEventListener('pointerdown', event => {
          if (button.disabled || movement) return;

          button.setPointerCapture(event.pointerId);
          movement = {
            pointerId: event.pointerId,
            x: Number(button.dataset.x),
            z: Number(button.dataset.z)
          };
          player.object3D.rotation.y = Math.atan2(movement.x, movement.z);
        });

        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
          button.addEventListener(type, event => {
            if (movement?.pointerId === event.pointerId) stopMoving();
          });
        }
      }

      document.querySelector('#reset').addEventListener('click', () => {
        stopMoving();
        player.object3D.position.set(0, 0, 0);
        player.object3D.rotation.y = Math.PI;

        if (walk) {
          walk.reset().play();
          mixer.update(0);
          walk.paused = true;
        }
      });

      window.addEventListener('blur', stopMoving);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopMoving();
      });

      const speed = 1.3;
      const edge = 1.65;
      const clamp = value => Math.max(-edge, Math.min(edge, value));
      let previousFrame;

      function frame(now) {
        const dt = Math.min((now - (previousFrame ?? now)) / 1000, 0.05);
        previousFrame = now;

        if (movement && tracking) {
          const position = player.object3D.position;
          const x = clamp(position.x + movement.x * speed * dt);
          const z = clamp(position.z + movement.z * speed * dt);

          if (walk) walk.paused = x === position.x && z === position.z;
          position.set(x, position.y, z);
          mixer?.update(dt);
        }

        requestAnimationFrame(frame);
      }

      connectRelay(() => {}, () => {
        lastPose = '';
        updateControls();
      });

      setInterval(() => {
        if (socket?.readyState !== WebSocket.OPEN || !player.object3D) return;

        const { x, z } = player.object3D.position;
        const yaw = player.object3D.rotation.y;
        const pose = JSON.stringify({ x, z, yaw });

        if (pose !== lastPose) {
          socket.send(pose);
          lastPose = pose;
        }
      }, 50);

      updateControls();
      requestAnimationFrame(frame);
    }

    document.body.append(scene);
  </script>
</body>
</html>
