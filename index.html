<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tim's AR Game</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font: 15px system-ui, sans-serif;
      color: #202124;
    }

    [hidden] { display: none !important; }

    .glass, button, select, input {
      color: #202124;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 16px;
      box-sizing: border-box;
    }

    button, select, input {
      font: inherit;
      padding: 9px 13px;
    }

    button:disabled { opacity: .5; }

    #status, #menu, #puzzle, #controls, #fullscreen, #sound {
      position: fixed;
      z-index: 10;
    }

    #status {
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 76vw;
      padding: 8px 14px;
      text-align: center;
      pointer-events: none;
    }

    #menu, #puzzle {
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: max-content;
      max-width: 82vw;
      padding: 10px;
      text-align: center;
    }

    #menu button, #menu select, #puzzle button { margin: 3px; }
    #puzzle p { margin: 5px 0 8px; }

    #code {
      width: 8ch;
      text-align: center;
      font-size: 20px;
      letter-spacing: .12em;
    }

    #digits {
      display: grid;
      grid-template-columns: repeat(3, minmax(42px, 1fr));
      max-width: 230px;
      margin: 6px auto;
    }

    #digits button {
      padding: 5px 10px;
      min-height: 34px;
    }

    #fullscreen {
      bottom: max(12px, env(safe-area-inset-bottom));
      left: calc(env(safe-area-inset-left, 0px) + 12px);
    }

    #sound {
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 22;
    }

    #controls {
      top: 50%;
      right: calc(env(safe-area-inset-right, 0px) + 20px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #reset, #stick {
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .85);
      background: rgba(255, 255, 255, .46);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 3px 16px rgba(0, 0, 0, .14);
    }

    #reset {
      width: 48px;
      height: 48px;
      padding: 0;
      color: white;
      font-size: 26px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .65);
    }

    #stick {
      position: relative;
      width: clamp(96px, 31vh, 142px);
      aspect-ratio: 1;
      touch-action: none;
    }

    #knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #cutscene {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: black;
    }

    #intro {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #video-actions {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <div id="status" class="glass" role="status">Loading…</div>
  <button id="fullscreen" type="button" hidden>Full screen</button>
  <button id="sound" type="button" hidden>Mute</button>

  <div id="menu" class="glass">
    <button id="play" type="button" hidden>Play</button>
    <button id="skip-setup" type="button" hidden>Skip intro</button>
    <button id="enable-audio" type="button" hidden>Enable TV audio</button>
    <label id="mount-label" hidden>
      Marker position
      <select id="mount">
        <option value="table">Flat on a table</option>
        <option value="upright">Upright on a screen or wall</option>
      </select>
    </label>
    <button id="start-ar" type="button" hidden>Start AR</button>
  </div>

  <div id="cutscene" hidden>
    <video id="intro" src="./intro.mp4?v=regular-1080" playsinline preload="auto"></video>
    <div id="video-actions">
      <button id="start-video" type="button" hidden>Start video with audio</button>
      <button id="skip-video" type="button" hidden>Skip intro</button>
    </div>
  </div>

  <div id="controls" hidden>
    <button id="reset" type="button" aria-label="Reset Tim">↺</button>
    <div id="stick" aria-label="Drag to move Tim">
      <span id="knob" aria-hidden="true"></span>
    </div>
  </div>

  <div id="puzzle" class="glass" hidden>
    <button id="enter-code" type="button" hidden>Enter code</button>
    <button id="close-memo" type="button" hidden>Close memo</button>

    <form id="keypad" hidden>
      <label for="code">Safe code</label>
      <input id="code" type="text" inputmode="none" readonly
             maxlength="4" autocomplete="off" aria-describedby="code-feedback">
      <div id="digits" role="group" aria-label="Number pad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" id="clear-code">Clear</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" id="delete-digit" aria-label="Delete last digit">⌫</button>
      </div>
      <button type="submit">Submit</button>
      <button id="cancel-code" type="button">Close</button>
      <p id="code-feedback" role="status"></p>
    </form>

    <button id="continue" type="button" hidden>Continue</button>
  </div>

  <audio id="music" src="./game-music.mp3" preload="metadata" loop></audio>

  <template id="phone-scene">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.0005; filterBeta: 50"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="floor-asset" src="./interior.glb"></a-asset-item>
        <a-asset-item id="character-asset" src="./character.glb"></a-asset-item>
        <a-asset-item id="walkable-asset" src="./top-walkable.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"
                wasd-controls="enabled: false"></a-camera>

      <a-entity id="marker" mindar-image-target="targetIndex: 0">
        <a-entity id="board" rotation="90 0 0" scale="0.026 0.026 0.026">
          <a-entity position="-2.01 0 -1.53">
            <a-entity id="floor" gltf-model="#floor-asset"></a-entity>
            <a-entity id="walkable" gltf-model="#walkable-asset"
                      visible="false"></a-entity>
            <a-entity id="player" rotation="0 180 0">
              <a-entity id="character" gltf-model="#character-asset"
                        scale="0.966 0.966 0.966"
                        position="0 -0.01 0"></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </template>

  <template id="tv-scene">
    <a-scene background="color: #7fb1d0" xr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="floor-asset" src="./interior.glb"></a-asset-item>
        <a-asset-item id="memo-asset" src="./memo.glb"></a-asset-item>
        <a-asset-item id="stone-asset" src="./stone.glb"></a-asset-item>
      </a-assets>

      <a-entity id="floor" gltf-model="#floor-asset"></a-entity>

      <a-entity id="rig">
        <a-camera position="0 1.6 0" look-controls="enabled: false"
                  wasd-controls="enabled: false">
          <a-entity id="memo-holder" position="0 0 -0.85"
                    rotation="0 180 0" visible="false">
            <a-entity id="memo" gltf-model="#memo-asset"></a-entity>
          </a-entity>
          <a-entity id="stone-holder" position="0 0 -0.95" visible="false">
            <a-entity id="stone" gltf-model="#stone-asset"></a-entity>
          </a-entity>
        </a-camera>
      </a-entity>
    </a-scene>
  </template>

  <script>
    const SAFE_CODE = '1127';
    const SPAWN = { x: 5, y: 10.301, z: 1.25 };
    const WALK_SPEED = 1.3;
    const INTERACTION_DISTANCE = 1.4;

    // Set these after locating the fridge and safe in the exported level.
    // FRIDGE is the standing spot and facing angle, in degrees. SAFE needs only x, y and z.
    const FRIDGE = { x: -2.9, y: 8.78, z: 4.0, yaw: 90 };
    const SAFE = { x: -4.4, y: 10.321, z: -2.65 };

    const tv = new URLSearchParams(location.search).has('tv');
    const byId = id => document.getElementById(id);
    const scene = byId(tv ? 'tv-scene' : 'phone-scene').content.cloneNode(true);
    const find = id => scene.querySelector('#' + id);
    const sceneElement = scene.querySelector('a-scene');
    const floor = find('floor');
    const rig = find('rig');
    const player = find('player');
    const status = byId('status');
    const menu = byId('menu');
    const cutscene = byId('cutscene');
    const video = byId('intro');
    const music = byId('music');
    const play = byId('play');
    const enableAudio = byId('enable-audio');
    const startVideo = byId('start-video');
    const sound = byId('sound');

    let socket;
    let lastMessage = '';
    let phase = 'idle';
    let puzzleState = 'explore';
    let introId = '';
    let startsAt = 0;
    let introTimer;
    let audioEnabled = false;
    let muted = false;
    let preparing = false;
    let mediaMessage = '';
    let renderPhone = () => {};
    let stopWalking = () => {};
    let latestPose;
    let lastTVIntro = '';
    let tvReady = false;
    let tvModelError = '';

    music.volume = 0.35;
    applyAudioState();

    function applyAudioState() {
      video.muted = !tv || muted;
      music.muted = !tv || muted;
    }
    (rig || player).setAttribute('position', `${SPAWN.x} ${SPAWN.y} ${SPAWN.z}`);

    function online() {
      return socket?.readyState === WebSocket.OPEN;
    }

    function refresh() {
      const inIntro = phase === 'intro';
      cutscene.hidden = !inIntro;
      sound.hidden = tv;
      sound.disabled = !online();
      sound.textContent = muted ? 'Unmute TV' : 'Mute TV';
      byId('skip-video').hidden = tv;

      if (tv) {
        const canEnable = !audioEnabled && !inIntro;
        menu.hidden = !canEnable;
        enableAudio.hidden = !canEnable;
        status.textContent = mediaMessage || tvModelError ||
          (!online() ? 'Connecting to the TV relay…'
            : phase === 'idle' && audioEnabled ? 'Ready for Play on the phone.'
            : phase === 'idle' ? 'Enable TV audio before pressing Play on the phone.'
            : '');
        status.hidden = inIntro || !status.textContent;
      } else {
        renderPhone();
      }
    }

    function reportMusicError(error) {
      audioEnabled = false;
      mediaMessage = error?.name === 'NotAllowedError'
        ? 'Click Enable TV audio on this screen to start the music.'
        : 'Could not play game-music.mp3. Check that the published file opens in Chrome.';
      refresh();
    }

    async function startMusic() {
      if (!tv || phase !== 'game' || !music.paused) return;
      try {
        await music.play();
        if (phase !== 'game') return;
        audioEnabled = true;
        mediaMessage = '';
        refresh();
      } catch (error) {
        if (phase === 'game') reportMusicError(error);
      }
    }

    function enterGame() {
      clearTimeout(introTimer);
      phase = 'game';
      video.pause();
      startVideo.hidden = true;
      mediaMessage = '';
      startMusic();
      refresh();
    }

    function startIntroPlayback(id) {
      if (phase !== 'intro' || introId !== id) return;

      if (Number.isFinite(video.duration)) {
        const seconds = Math.max(0, (Date.now() - startsAt) / 1000);
        if (seconds >= video.duration) {
          enterGame();
          return;
        }
        if (Math.abs(video.currentTime - seconds) > 0.15) {
          video.currentTime = seconds;
        }
      }

      video.play().then(() => {
        if (phase !== 'intro' || introId !== id) return;
        startVideo.hidden = true;
      }).catch(() => {
        if (phase === 'intro' && introId === id) startVideo.hidden = false;
      });
    }

    function scheduleIntro(id, time) {
      clearTimeout(introTimer);
      stopWalking();
      music.pause();
      phase = 'intro';
      introId = id;
      startsAt = time;
      mediaMessage = '';
      startVideo.hidden = true;

      if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
        video.currentTime = 0;
      }

      refresh();
      introTimer = setTimeout(
        () => startIntroPlayback(id),
        Math.max(0, time - Date.now())
      );
    }

    play.addEventListener('click', async () => {
      if (phase !== 'idle' || preparing) return;

      preparing = true;
      refresh();
      try {
        // Give the iPhone video element a local playback gesture.
        await video.play();
        video.pause();

        if (phase === 'idle') {
          scheduleIntro(String(Date.now()), Date.now() + 1800);
        }
      } catch {
        mediaMessage = 'Could not play intro.mp4. Try again or skip.';
      } finally {
        preparing = false;
        refresh();
      }
    });

    async function prepareTVMedia(media, keepPlaying) {
      const volume = media.volume;
      if (!keepPlaying) media.volume = 0;

      try {
        await media.play();
        if (!keepPlaying && phase === 'idle') {
          media.pause();
          media.currentTime = 0;
        }
      } finally {
        media.volume = volume;
      }
    }

    enableAudio.addEventListener('click', async () => {
      if (phase === 'game') {
        await startMusic();
        return;
      }
      if (phase !== 'idle') return;

      enableAudio.disabled = true;
      // Start both elements from the same user gesture on the TV browser.
      const results = await Promise.allSettled([
        prepareTVMedia(video, false),
        prepareTVMedia(music, false)
      ]);
      enableAudio.disabled = false;

      if (phase !== 'idle') return;
      if (results[1].status === 'rejected') {
        reportMusicError(results[1].reason);
        return;
      }

      audioEnabled = results[0].status === 'fulfilled';
      mediaMessage = audioEnabled ? '' : 'Music is ready. Could not prepare intro.mp4.';
      refresh();
    });

    music.addEventListener('error', () => {
      if (tv && phase === 'game') reportMusicError(music.error);
    });

    startVideo.addEventListener('click', () => startIntroPlayback(introId));
    byId('skip-setup').addEventListener('click', enterGame);
    byId('skip-video').addEventListener('click', enterGame);

    sound.addEventListener('click', () => {
      if (tv || !online()) return;
      muted = !muted;
      lastMessage = '';
      refresh();
    });

    video.addEventListener('ended', () => {
      if (phase === 'intro') enterGame();
    });

    video.addEventListener('error', () => {
      if (phase === 'intro') enterGame();
      mediaMessage = 'Could not load intro.mp4. Open the published file in this browser to check it.';
      refresh();
    });

    function applyTVPose() {
      if (!tvReady || !latestPose) return;
      const { x, y, z, yaw } = latestPose;
      rig.object3D.position.set(x, y, z);
      rig.object3D.rotation.y = yaw + Math.PI;
      find('memo-holder').object3D.visible = puzzleState === 'memo';
      find('stone-holder').object3D.visible = puzzleState === 'stone';
    }

    function receiveTVMessage(event) {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch {
        return;
      }

      const { x, y, z, yaw, introState, introId: id, introStartsAt, introDelayMs, puzzle, tvMuted } = data ?? {};
      if (![x, z, yaw].every(Number.isFinite)) return;

      if (typeof tvMuted === 'boolean' && muted !== tvMuted) {
        muted = tvMuted;
        applyAudioState();
        if (!muted && phase === 'game') startMusic();
      }

      latestPose = { x, y: Number.isFinite(y) ? y : SPAWN.y, z, yaw };
      puzzleState = puzzle === 'memo' || puzzle === 'stone' ? puzzle : 'explore';
      applyTVPose();

      if (introState === 'intro' && typeof id === 'string' && id &&
          id !== lastTVIntro && Number.isFinite(introStartsAt)) {
        lastTVIntro = id;
        const localStart = Number.isFinite(introDelayMs)
          ? Date.now() + introDelayMs : introStartsAt;
        scheduleIntro(id, localStart);
      } else if (introState === 'game' && phase !== 'game') {
        enterGame();
      }
    }

    function connectRelay() {
      const url = new URL('wss://ardemorelay.onrender.com');
      url.searchParams.set('role', tv ? 'tv' : 'phone');

      socket = new WebSocket(url);
      if (tv) socket.addEventListener('message', receiveTVMessage);

      socket.addEventListener('open', () => {
        lastMessage = '';
        refresh();
      });

      socket.addEventListener('close', () => {
        refresh();
        setTimeout(connectRelay, 2000);
      });
    }

    if (tv) {
      const { Box3, Vector3 } = AFRAME.THREE;

      // Frame each prop from its actual bounds, accounting for export offsets.
      function frameProp(entity, displaySize) {
        entity.addEventListener('model-loaded', event => {
          const model = event.detail.model;
          const copy = model.clone(true);
          copy.updateMatrixWorld(true);

          const bounds = new Box3().setFromObject(copy);
          if (bounds.isEmpty()) return;

          const size = bounds.getSize(new Vector3());
          const center = bounds.getCenter(new Vector3());
          const scale = displaySize / Math.max(size.x, size.y, size.z);
          if (!Number.isFinite(scale)) return;

          entity.object3D.scale.setScalar(scale);
          entity.object3D.position.copy(center.multiplyScalar(-scale));
        });
      }

      frameProp(find('memo'), 0.54);
      frameProp(find('stone'), 0.40);

      for (const [entity, filename] of [
        [floor, 'interior.glb'],
        [find('memo'), 'memo.glb'],
        [find('stone'), 'stone.glb']
      ]) {
        entity.addEventListener('model-error', () => {
          tvModelError = 'Could not load ' + filename + '.';
          refresh();
        });
      }

      sceneElement.addEventListener('loaded', () => {
        tvReady = true;
        applyTVPose();
      });
    } else {
      const marker = find('marker');
      const board = find('board');
      const character = find('character');
      const walkable = find('walkable');
      const startAR = byId('start-ar');
      const mount = byId('mount');
      const fullscreen = byId('fullscreen');
      const controls = byId('controls');
      const stick = byId('stick');
      const knob = byId('knob');
      const puzzle = byId('puzzle');
      const enterCode = byId('enter-code');
      const closeMemo = byId('close-memo');
      const keypad = byId('keypad');
      const code = byId('code');
      const feedback = byId('code-feedback');
      const continueButton = byId('continue');
      const landscape = matchMedia('(orientation: landscape)');

      const { Raycaster, Vector3, DoubleSide, AnimationMixer } = AFRAME.THREE;
      const ray = new Raycaster();
      const rayStart = new Vector3();
      const rayEnd = new Vector3();
      const direction = new Vector3();

      let arSystem;
      let arStarted = false;
      let needsRestart = false;
      let tracking = false;
      let floorReady = false;
      let characterReady = false;
      let walkableMesh;
      let spawnValid = false;
      let spawnChecked = false;
      let error = '';
      let movement = null;
      let pointerId = null;
      let memoRead = false;
      let fridgeEnteredAt = null;
      let memoShownOnThisVisit = false;
      let unlocked = false;
      let walk;
      let mixer;
      let previousFrame;

      mount.value = sessionStorage.getItem('ar-marker-mount') || 'table';
      fullscreen.hidden = navigator.standalone === true ||
        matchMedia('(display-mode: standalone)').matches;

      function near(point, distance = INTERACTION_DISTANCE) {
        if (!point) return false;
        const { x, y, z } = player.object3D.position;
        return Math.hypot(x - point.x, y - point.y, z - point.z) <= distance;
      }

      renderPhone = () => {
        const assetsReady = floorReady && characterReady && Boolean(walkableMesh);
        const canInteract = phase === 'game' && landscape.matches && tracking &&
          assetsReady && spawnValid && !needsRestart && !error;
        const exploring = canInteract && puzzleState === 'explore';

        play.hidden = phase !== 'idle';
        play.disabled = preparing;
        byId('skip-setup').hidden = phase !== 'idle';
        byId('mount-label').hidden = phase !== 'game' || (arStarted && !needsRestart);
        startAR.hidden = byId('mount-label').hidden;
        startAR.disabled = !landscape.matches || !arSystem;
        startAR.textContent = needsRestart ? 'Reload AR' : 'Start AR';

        menu.hidden = phase === 'intro' || (phase === 'game' && startAR.hidden);
        controls.hidden = !exploring;
        enterCode.hidden = !exploring || !memoRead || !near(SAFE);
        enterCode.textContent = unlocked ? 'View stone' : 'Enter code';

        closeMemo.hidden = puzzleState !== 'memo';
        keypad.hidden = puzzleState !== 'keypad';
        continueButton.hidden = puzzleState !== 'stone';
        puzzle.hidden = enterCode.hidden && closeMemo.hidden &&
          keypad.hidden && continueButton.hidden;

        let message = error || mediaMessage;
        if (!message) {
          if (phase === 'idle') message = 'Press Play. Open the TV view for the shared intro.';
          else if (phase === 'intro') message = '';
          else if (!landscape.matches) message = 'Turn your phone sideways.';
          else if (needsRestart) message = 'Reload AR to align the camera.';
          else if (!arStarted) message = 'Choose how the marker is mounted, then tap Start AR.';
          else if (!tracking) message = 'Point the camera at the marker.';
          else if (!assetsReady || !spawnChecked) message = 'Loading the top level…';
          else if (!spawnValid) message = 'Could not place Tim on the walkable surface.';
          else if (puzzleState === 'memo') message = 'Read the memo on the TV.';
          else if (puzzleState === 'stone') message = 'Look at the stone on the TV.';
          else if (puzzleState === 'keypad') message = 'Enter the code from the memo.';
          else if (unlocked) message = 'Stone found.';
          else message = memoRead ? 'Go to the safe to unlock it and get the stone.' : '';
        }

        status.textContent = message;
        status.hidden = !message || phase === 'intro';
      };

      function stopMotion() {
        movement = null;
        if (walk) walk.paused = true;
      }

      stopWalking = () => {
        pointerId = null;
        knob.style.transform = 'translate(-50%, -50%)';
        stopMotion();
      };

      function openPuzzle(state) {
        stopWalking();
        puzzleState = state;
        refresh();
      }

      function checkFridge(now) {
        if (controls.hidden) {
          fridgeEnteredAt = null;
          return;
        }

        if (!near(FRIDGE, 0.65)) {
          fridgeEnteredAt = null;
          memoShownOnThisVisit = false;
          return;
        }

        const heading = player.object3D.rotation.y;
        const fridgeHeading = FRIDGE.yaw * Math.PI / 180;
        const facingFridge = Math.cos(heading - fridgeHeading) >= Math.cos(Math.PI / 6);
        if (!facingFridge || movement || memoShownOnThisVisit) {
          fridgeEnteredAt = null;
          return;
        }

        fridgeEnteredAt ??= now;
        if (now - fridgeEnteredAt < 250) return;

        memoShownOnThisVisit = true;
        memoRead = true;
        openPuzzle('memo');
      }

      closeMemo.addEventListener('click', () => openPuzzle('explore'));

      enterCode.addEventListener('click', () => {
        if (unlocked) {
          openPuzzle('stone');
        } else {
          code.value = '';
          feedback.textContent = '';
          openPuzzle('keypad');
        }
      });

      for (const button of byId('digits').querySelectorAll('[data-digit]')) {
        button.addEventListener('click', () => {
          if (code.value.length < 4) code.value += button.dataset.digit;
          feedback.textContent = '';
        });
      }

      byId('clear-code').addEventListener('click', () => {
        code.value = '';
        feedback.textContent = '';
      });

      byId('delete-digit').addEventListener('click', () => {
        code.value = code.value.slice(0, -1);
        feedback.textContent = '';
      });

      keypad.addEventListener('submit', event => {
        event.preventDefault();

        if (code.value.length !== 4) {
          feedback.textContent = 'Enter all four digits.';
          return;
        }

        if (code.value !== SAFE_CODE) {
          feedback.textContent = 'Incorrect code. Try again.';
          code.value = '';
          return;
        }

        unlocked = true;
        code.blur();
        openPuzzle('stone');
      });

      byId('cancel-code').addEventListener('click', () => {
        code.blur();
        openPuzzle('explore');
      });

      continueButton.addEventListener('click', () => openPuzzle('explore'));

      function findGround(x, z, y) {
        const level = player.object3D?.parent;
        if (!walkableMesh || !level) return null;

        level.updateWorldMatrix(true, false);
        walkableMesh.updateWorldMatrix(true, true);
        level.localToWorld(rayStart.set(x, y + 0.25, z));
        level.localToWorld(rayEnd.set(x, y - 0.30, z));
        direction.subVectors(rayEnd, rayStart);
        ray.far = direction.length();
        if (!ray.far) return null;

        ray.set(rayStart, direction.normalize());
        const [hit] = ray.intersectObject(walkableMesh, true);
        return hit ? level.worldToLocal(hit.point).y : null;
      }

      function placeAtSpawn() {
        const y = findGround(SPAWN.x, SPAWN.z, SPAWN.y);
        spawnChecked = true;
        spawnValid = y !== null;

        if (spawnValid) {
          player.object3D.position.set(SPAWN.x, y, SPAWN.z);
          player.object3D.rotation.y = Math.PI;
        }
      }

      function trySpawn() {
        if (tracking && walkableMesh && !spawnValid) placeAtSpawn();
        refresh();
      }

      sceneElement.addEventListener('loaded', () => {
        arSystem = sceneElement.systems['mindar-image-system'];
        refresh();
      });

      startAR.addEventListener('click', () => {
        if (!landscape.matches || !arSystem) return;

        sessionStorage.setItem('ar-marker-mount', mount.value);
        if (needsRestart) {
          arStarted = false;
          needsRestart = false;
          tracking = false;
          error = '';
        }

        const upright = mount.value === 'upright';
        board.setAttribute('rotation', upright ? '0 0 0' : '90 0 0');
        board.setAttribute('position', upright ? '0 0 0.25' : '0 0 0');
        arStarted = true;
        refresh();

        try {
          arSystem.start();
        } catch {
          error = 'Could not start AR. Check camera access.';
          arStarted = false;
          refresh();
        }
      });

      fullscreen.addEventListener('click', async () => {
        try {
          await document.documentElement.requestFullscreen();
        } catch {
          mediaMessage = 'In Safari, use Share → Add to Home Screen → Open as Web App.';
          refresh();
        }
      });

      marker.addEventListener('targetFound', () => {
        tracking = true;
        requestAnimationFrame(trySpawn);
      });

      marker.addEventListener('targetLost', () => {
        tracking = false;
        stopWalking();
        refresh();
      });

      landscape.addEventListener('change', () => {
        stopWalking();

        // Focusing the keypad can change the viewport, so leave AR alone then.
        if (puzzleState !== 'keypad' && arStarted && !landscape.matches) {
          try { arSystem.stop(); } catch {}
          needsRestart = true;
          tracking = false;
        }

        refresh();
      });

      window.addEventListener('blur', stopWalking);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopWalking();
      });

      floor.addEventListener('model-loaded', () => {
        floorReady = true;
        refresh();
      });

      character.addEventListener('model-loaded', event => {
        const model = event.detail.model;
        const clip = model.animations?.[0];

        if (clip) {
          mixer = new AnimationMixer(model);
          walk = mixer.clipAction(clip).play();
          mixer.update(0);
          walk.paused = true;
        }

        characterReady = true;
        refresh();
      });

      walkable.addEventListener('model-loaded', event => {
        walkableMesh = event.detail.model;
        walkableMesh.traverse(object => {
          if (!object.isMesh) return;
          const materials = Array.isArray(object.material)
            ? object.material : [object.material];
          for (const material of materials) material.side = DoubleSide;
        });
        requestAnimationFrame(trySpawn);
      });

      for (const [entity, filename] of [
        [floor, 'interior.glb'],
        [character, 'character.glb'],
        [walkable, 'top-walkable.glb']
      ]) {
        entity.addEventListener('model-error', () => {
          error = 'Could not load ' + filename + '.';
          stopWalking();
          refresh();
        });
      }

      sceneElement.addEventListener('arError', () => {
        error = 'Could not start AR. Check camera access and targets.mind.';
        arStarted = false;
        stopWalking();
        refresh();
      });

      function moveStick(event) {
        const bounds = stick.getBoundingClientRect();
        const radius = (bounds.width - knob.offsetWidth) / 2;
        if (radius <= 0) return;

        const dx = event.clientX - bounds.left - bounds.width / 2;
        const dy = event.clientY - bounds.top - bounds.height / 2;
        const distance = Math.hypot(dx, dy);
        const amount = Math.min(distance / radius, 1);
        const knobScale = distance > radius ? radius / distance : 1;

        knob.style.transform =
          `translate(-50%, -50%) translate(${dx * knobScale}px, ${dy * knobScale}px)`;

        if (amount <= 0.12) {
          stopMotion();
          return;
        }

        const throttle = (amount - 0.12) / 0.88;
        movement = { x: dx / distance * throttle, z: dy / distance * throttle };
        player.object3D.rotation.y = Math.atan2(movement.x, movement.z);
      }

      stick.addEventListener('pointerdown', event => {
        if (controls.hidden || pointerId !== null || event.button !== 0) return;

        pointerId = event.pointerId;
        stick.setPointerCapture(pointerId);
        moveStick(event);
      });

      stick.addEventListener('pointermove', event => {
        if (event.pointerId === pointerId) moveStick(event);
      });

      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        stick.addEventListener(type, event => {
          if (event.pointerId === pointerId) stopWalking();
        });
      }

      byId('reset').addEventListener('click', () => {
        stopWalking();
        placeAtSpawn();

        if (walk) {
          walk.reset().play();
          mixer.update(0);
          walk.paused = true;
        }

        refresh();
      });

      function frame(now) {
        const dt = Math.min((now - (previousFrame ?? now)) / 1000, 0.05);
        previousFrame = now;

        if (movement && tracking && spawnValid && !controls.hidden) {
          const position = player.object3D.position;
          const nextX = position.x + movement.x * WALK_SPEED * dt;
          const nextZ = position.z + movement.z * WALK_SPEED * dt;
          const candidates = [[nextX, nextZ], [nextX, position.z], [position.x, nextZ]];
          let moved = false;

          for (const [x, z] of candidates) {
            if (Math.hypot(x - position.x, z - position.z) < 0.0001) continue;
            const y = findGround(x, z, position.y);
            if (y === null) continue;
            position.set(x, y, z);
            moved = true;
            break;
          }

          if (walk) walk.paused = !moved;
          mixer?.update(dt);
          if (moved) refresh();
        }

        checkFridge(now);
        requestAnimationFrame(frame);
      }

      setInterval(() => {
        if (!online()) return;

        const position = player.object3D?.position ?? SPAWN;
        const yaw = player.object3D?.rotation.y ?? Math.PI;
        const message = JSON.stringify({
          x: position.x,
          y: position.y,
          z: position.z,
          yaw,
          introState: phase,
          introId,
          introStartsAt: startsAt,
          introDelayMs: phase === 'intro' ? 1750 : undefined,
          puzzle: puzzleState,
          tvMuted: muted
        });

        if (message === lastMessage) return;

        socket.send(message);
        lastMessage = message;
      }, 50);

      requestAnimationFrame(frame);
    }

    document.body.append(scene);
    connectRelay();
    refresh();
  </script>
</body>
</html>
