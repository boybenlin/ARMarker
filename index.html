<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Walk Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; font: 15px system-ui, sans-serif; }
    [hidden] { display: none !important; }

    #status, #controls, #setup, #fullscreen {
      position: fixed;
      z-index: 10;
      color: #202124;
    }

    #status {
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 76vw;
      margin: 0;
      padding: 9px 16px;
      border-radius: 40px;
      background: rgba(255, 255, 255, .84);
      text-align: center;
      pointer-events: none;
    }

    #controls {
      top: 50%;
      right: calc(env(safe-area-inset-right, 0px) + 20px);
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #reset, #stick {
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 50%;
      background: rgba(255, 255, 255, .46);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 3px 16px rgba(0, 0, 0, .14);
    }

    #reset {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      color: white;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .65);
      font: 27px/1 system-ui, sans-serif;
      -webkit-appearance: none;
      appearance: none;
    }

    #stick {
      position: relative;
      width: clamp(96px, 31vh, 142px);
      aspect-ratio: 1;
    }

    #knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, .93);
      box-shadow: 0 2px 9px rgba(0, 0, 0, .16);
      pointer-events: none;
    }

    #reset:disabled, #stick[aria-disabled="true"] { opacity: .45; }

    #setup {
      z-index: 12;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(80vw, 400px);
      padding: 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      text-align: center;
    }

    #setup button, #setup select, #fullscreen {
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 12px;
      background: rgba(255, 255, 255, .90);
      color: #202124;
      font: inherit;
    }

    #setup button, #setup select { margin: 4px; }
    #setup p { margin: 6px 0 0; }

    #fullscreen {
      z-index: 13;
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      bottom: max(12px, env(safe-area-inset-bottom));
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <p id="status" role="status">Loading…</p>
  <button id="fullscreen" type="button" hidden>Full screen</button>

  <section id="setup" hidden>
    <label for="mount">Marker position</label>
    <select id="mount">
      <option value="table">Flat on a table</option>
      <option value="upright">Upright on a screen or wall</option>
    </select>
    <button id="start-ar" type="button" disabled>Start AR</button>
    <p id="setup-note"></p>
  </section>

  <div id="controls" role="group" aria-label="Character controls" hidden>
    <button id="reset" type="button" aria-label="Reset Tim" disabled>↺</button>
    <div id="stick" role="group" aria-label="Drag to move Tim" aria-disabled="true">
      <span id="knob" aria-hidden="true"></span>
    </div>
  </div>

  <template id="phone-scene">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; filterMinCF: 0.0005; filterBeta: 100"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="floor-asset" src="./interior.glb"></a-asset-item>
        <a-asset-item id="character-asset" src="./character.glb?v=tim-20261126"></a-asset-item>
        <a-asset-item id="walkable-asset" src="./top-walkable.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"
                wasd-controls="enabled: false"></a-camera>

      <a-entity id="marker" mindar-image-target="targetIndex: 0">
        <a-entity id="board" rotation="90 0 0" scale="0.026 0.026 0.026">
          <a-entity position="-2.01 0 -1.53">
            <a-entity id="floor" gltf-model="#floor-asset"></a-entity>
            <a-entity id="walkable" gltf-model="#walkable-asset" visible="false"></a-entity>
            <a-entity id="player" rotation="0 180 0">
              <a-entity id="character" gltf-model="#character-asset"
                        scale="0.966 0.966 0.966" position="0 -0.01 0"></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </template>

  <template id="tv-scene">
    <a-scene background="color: #7fb1d0" xr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="floor-asset" src="./interior.glb"></a-asset-item>
      </a-assets>
      <a-entity id="floor" gltf-model="#floor-asset"></a-entity>
      <a-entity id="camera-rig">
        <a-camera position="0 1.6 0" look-controls="enabled: false"
                  wasd-controls="enabled: false"></a-camera>
      </a-entity>
    </a-scene>
  </template>

  <script>
    const SPAWN = { x: 5, y: 10.301, z: 1.25 };
    const WALK_SPEED = 1.3;

    const tvMode = new URLSearchParams(location.search).has('tv');
    const status = document.querySelector('#status');
    const template = document.querySelector(tvMode ? '#tv-scene' : '#phone-scene');
    const scene = template.content.cloneNode(true);
    const sceneElement = scene.querySelector('a-scene');
    const floor = scene.querySelector('#floor');

    const relayUrl = new URL('wss://ardemorelay.onrender.com');
    relayUrl.searchParams.set('role', tvMode ? 'tv' : 'phone');
    let socket;

    function relayConnected() {
      return socket?.readyState === WebSocket.OPEN;
    }

    function connectRelay(onMessage, onChange) {
      socket = new WebSocket(relayUrl);
      socket.addEventListener('message', onMessage);
      socket.addEventListener('open', onChange);
      socket.addEventListener('close', () => {
        onChange();
        setTimeout(() => connectRelay(onMessage, onChange), 2000);
      });
    }

    function setSpawnPosition(entity) {
      entity.setAttribute('position', `${SPAWN.x} ${SPAWN.y} ${SPAWN.z}`);
    }

    if (tvMode) {
      const rig = scene.querySelector('#camera-rig');
      let floorFailed = false;
      let latestPose = null;

      setSpawnPosition(rig);

      function showStatus() {
        status.hidden = !floorFailed && relayConnected() && Boolean(latestPose);
        status.textContent = floorFailed ? 'Could not load interior.glb.'
          : relayConnected() ? 'Waiting for the phone…' : 'Connecting to the TV relay…';
      }

      function applyPose() {
        if (!latestPose || !rig.object3D) return;
        const { x, y, z, yaw } = latestPose;
        rig.object3D.position.set(x, y, z);
        rig.object3D.rotation.y = yaw + Math.PI;
      }

      sceneElement.addEventListener('loaded', applyPose);

      floor.addEventListener('model-error', () => {
        floorFailed = true;
        showStatus();
      });

      connectRelay(event => {
        let pose;
        try {
          pose = JSON.parse(event.data);
        } catch {
          return;
        }

        const { x, y, z, yaw } = pose ?? {};
        if (![x, z, yaw].every(Number.isFinite)) return;
        latestPose = { x, y: Number.isFinite(y) ? y : SPAWN.y, z, yaw };
        applyPose();
        showStatus();
      }, showStatus);

      showStatus();
    } else {
      const marker = scene.querySelector('#marker');
      const board = scene.querySelector('#board');
      const player = scene.querySelector('#player');
      const character = scene.querySelector('#character');
      const walkable = scene.querySelector('#walkable');
      const controls = document.querySelector('#controls');
      const reset = document.querySelector('#reset');
      const stick = document.querySelector('#stick');
      const knob = document.querySelector('#knob');
      const setup = document.querySelector('#setup');
      const mount = document.querySelector('#mount');
      const start = document.querySelector('#start-ar');
      const fullscreen = document.querySelector('#fullscreen');
      const note = document.querySelector('#setup-note');
      const landscape = matchMedia('(orientation: landscape)');

      const { Raycaster, Vector3, DoubleSide } = AFRAME.THREE;
      const groundRay = new Raycaster();
      const rayStart = new Vector3();
      const rayEnd = new Vector3();
      const rayDirection = new Vector3();

      let arSystem;
      let started = false;
      let needsRestart = false;
      let fullscreenHelp = false;
      let tracking = false;
      let floorReady = false;
      let characterReady = false;
      let walkableMesh = null;
      let spawnChecked = false;
      let spawnValid = false;
      let error = '';
      let pointerId = null;
      let movement = null;
      let mixer;
      let walk;
      let lastPose = '';
      let lastFrame;

      setSpawnPosition(player);
      mount.value = sessionStorage.getItem('ar-marker-mount') === 'upright'
        ? 'upright' : 'table';
      fullscreen.hidden = navigator.standalone === true ||
        matchMedia('(display-mode: standalone)').matches;

      function updateControls() {
        const assetsReady = floorReady && characterReady && Boolean(walkableMesh);
        const ready = landscape.matches && started && !needsRestart &&
          tracking && assetsReady && spawnValid && !error;

        setup.hidden = started && !needsRestart && !fullscreenHelp;
        mount.disabled = started && !needsRestart;
        start.hidden = started && !needsRestart;
        start.disabled = !landscape.matches || !arSystem;
        start.textContent = needsRestart ? 'Reload AR' : 'Start AR';

        note.textContent = fullscreenHelp
          ? 'In Safari, use Share → Add to Home Screen → Open as Web App.'
          : needsRestart ? 'Turn sideways, reload, then tap Start AR.'
          : 'Choose how your marker is mounted.';

        controls.hidden = !landscape.matches || !started || needsRestart;
        reset.disabled = !ready;
        stick.setAttribute('aria-disabled', String(!ready));

        let message = error;
        if (!message) {
          if (!landscape.matches) message = 'Turn your phone sideways to play.';
          else if (needsRestart) message = 'Reload to align the AR camera.';
          else if (!started) message = 'Choose your marker position and start AR.';
          else if (!tracking) message = 'Point your camera at the marker.';
          else if (!assetsReady || !spawnChecked) message = 'Loading the top level…';
          else if (!spawnValid) message = 'Tim’s spawn is outside the walkable surface. Check SPAWN in index.html.';
          else message = 'Drag the stick to move Tim.';
        }

        status.textContent = message +
          (relayConnected() ? '' : ' Connecting to the TV relay…');
      }

      function stopMoving() {
        pointerId = null;
        movement = null;
        knob.style.transform = 'translate(-50%, -50%)';
        if (walk) walk.paused = true;
      }

      function findGround(x, z, currentY) {
        const level = player.object3D?.parent;
        if (!walkableMesh || !level) return null;

        level.updateWorldMatrix(true, false);
        walkableMesh.updateWorldMatrix(true, true);

        rayStart.set(x, currentY + 0.25, z);
        rayEnd.set(x, currentY - 0.30, z);
        level.localToWorld(rayStart);
        level.localToWorld(rayEnd);

        rayDirection.subVectors(rayEnd, rayStart);
        groundRay.far = rayDirection.length();
        if (groundRay.far === 0) return null;

        groundRay.set(rayStart, rayDirection.normalize());
        const [hit] = groundRay.intersectObject(walkableMesh, true);
        return hit ? level.worldToLocal(hit.point).y : null;
      }

      function placeAtSpawn() {
        const y = findGround(SPAWN.x, SPAWN.z, SPAWN.y);
        spawnValid = y !== null;
        spawnChecked = true;

        if (spawnValid) {
          player.object3D.position.set(SPAWN.x, y, SPAWN.z);
          player.object3D.rotation.y = Math.PI;
        }
      }

      function checkSpawnWhenReady() {
        if (tracking && walkableMesh && !spawnChecked) placeAtSpawn();
        updateControls();
      }

      sceneElement.addEventListener('loaded', () => {
        arSystem = sceneElement.systems['mindar-image-system'];
        updateControls();
      });

      start.addEventListener('click', async () => {
        if (!landscape.matches || !arSystem) return;

        sessionStorage.setItem('ar-marker-mount', mount.value);
        if (needsRestart) {
          location.reload();
          return;
        }

        const upright = mount.value === 'upright';
        board.setAttribute('rotation', upright ? '0 0 0' : '90 0 0');
        board.setAttribute('position', upright ? '0 0 0.25' : '0 0 0');
        started = true;
        fullscreenHelp = false;
        updateControls();

        try {
          await arSystem.start();
        } catch {
          error = 'Could not start AR. Check camera access and reload.';
          needsRestart = true;
          updateControls();
        }
      });

      fullscreen.addEventListener('click', async () => {
        try {
          if (!document.documentElement.requestFullscreen) throw new Error();
          await document.documentElement.requestFullscreen();
        } catch {
          fullscreenHelp = true;
          updateControls();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        fullscreen.hidden = Boolean(document.fullscreenElement);
      });

      function moveStick(event) {
        const bounds = stick.getBoundingClientRect();
        const radius = (bounds.width - knob.offsetWidth) / 2;
        if (radius <= 0) return;

        const dx = event.clientX - (bounds.left + bounds.width / 2);
        const dy = event.clientY - (bounds.top + bounds.height / 2);
        const distance = Math.hypot(dx, dy);
        const knobScale = distance > radius ? radius / distance : 1;

        knob.style.transform =
          `translate(-50%, -50%) translate(${dx * knobScale}px, ${dy * knobScale}px)`;

        const strength = Math.min(distance / radius, 1);
        const deadZone = 0.12;
        if (strength <= deadZone) {
          movement = null;
          if (walk) walk.paused = true;
          return;
        }

        const throttle = (strength - deadZone) / (1 - deadZone);
        movement = {
          x: dx / distance * throttle,
          z: dy / distance * throttle
        };
        player.object3D.rotation.y = Math.atan2(movement.x, movement.z);
      }

      stick.addEventListener('pointerdown', event => {
        if (reset.disabled || pointerId !== null) return;
        if (event.pointerType === 'mouse' && event.button !== 0) return;

        pointerId = event.pointerId;
        stick.setPointerCapture(pointerId);
        moveStick(event);
      });

      stick.addEventListener('pointermove', event => {
        if (event.pointerId === pointerId) moveStick(event);
      });

      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        stick.addEventListener(type, event => {
          if (event.pointerId === pointerId) stopMoving();
        });
      }

      reset.addEventListener('click', () => {
        stopMoving();
        placeAtSpawn();

        if (walk) {
          walk.reset().play();
          mixer.update(0);
          walk.paused = true;
        }

        updateControls();
      });

      marker.addEventListener('targetFound', () => {
        tracking = true;
        // MindAR applies the marker transform after dispatching this event.
        requestAnimationFrame(checkSpawnWhenReady);
      });

      marker.addEventListener('targetLost', () => {
        tracking = false;
        stopMoving();
        updateControls();
      });

      landscape.addEventListener('change', () => {
        if (started) needsRestart = true;
        stopMoving();
        updateControls();
      });

      window.addEventListener('blur', stopMoving);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopMoving();
      });

      floor.addEventListener('model-loaded', () => {
        floorReady = true;
        updateControls();
      });

      character.addEventListener('model-loaded', event => {
        const model = event.detail.model;
        const clip = model.animations?.[0];

        if (clip) {
          mixer = new AFRAME.THREE.AnimationMixer(model);
          walk = mixer.clipAction(clip).play();
          mixer.update(0);
          walk.paused = true;
        }

        characterReady = true;
        updateControls();
      });

      walkable.addEventListener('model-loaded', event => {
        walkableMesh = event.detail.model;
        walkableMesh.traverse(object => {
          if (!object.isMesh) return;

          const materials = Array.isArray(object.material)
            ? object.material : [object.material];
          for (const material of materials) material.side = DoubleSide;
        });

        checkSpawnWhenReady();
      });

      for (const [entity, file] of [
        [floor, 'interior.glb'],
        [character, 'character.glb'],
        [walkable, 'top-walkable.glb']
      ]) {
        entity.addEventListener('model-error', () => {
          error = `Could not load ${file}.`;
          stopMoving();
          updateControls();
        });
      }

      sceneElement.addEventListener('arError', () => {
        error = 'Could not start AR. Check camera access and targets.mind.';
        needsRestart = true;
        stopMoving();
        updateControls();
      });

      function frame(now) {
        const dt = Math.min((now - (lastFrame ?? now)) / 1000, 0.05);
        lastFrame = now;

        if (movement && tracking && spawnValid) {
          const position = player.object3D.position;
          const nextX = position.x + movement.x * WALK_SPEED * dt;
          const nextZ = position.z + movement.z * WALK_SPEED * dt;
          const candidates = [
            [nextX, nextZ],
            [nextX, position.z],
            [position.x, nextZ]
          ];

          let moved = false;
          for (const [x, z] of candidates) {
            if (Math.hypot(x - position.x, z - position.z) < 0.0001) continue;

            const ground = findGround(x, z, position.y);
            if (ground === null) continue;

            position.set(x, ground, z);
            moved = true;
            break;
          }

          if (walk) walk.paused = !moved;
          mixer?.update(dt);
        }

        requestAnimationFrame(frame);
      }

      connectRelay(() => {}, () => {
        lastPose = '';
        updateControls();
      });

      setInterval(() => {
        if (!relayConnected() || !spawnValid || !player.object3D) return;

        const { x, y, z } = player.object3D.position;
        const yaw = player.object3D.rotation.y;
        const pose = JSON.stringify({ x, y, z, yaw });

        if (pose === lastPose) return;
        socket.send(pose);
        lastPose = pose;
      }, 50);

      updateControls();
      requestAnimationFrame(frame);
    }

    document.body.append(scene);
  </script>
</body>
</html>
